# Britannia Phase 2 — hermetic, pinned Aserto Topaz authorizer.
#
# Compose project name is FIXED to `britannia-phase2` (see `name:` below) so this
# stack can never collide with the other stacks on this host (arena-*, aftershock-*,
# k12-staging-*). Always drive it with bin/topaz_up.sh / bin/topaz_down.sh.
#
# -----------------------------------------------------------------------------
# HOST PORT MAPPING (verified free on this host on 2026-08-16)
# -----------------------------------------------------------------------------
#   HOST (127.0.0.1)  ->  CONTAINER   SERVICE
#   8282              ->  8282        authorizer gRPC
#   8383              ->  8383        authorizer REST gateway   (/api/v2/...)
#   9292              ->  9292        directory gRPC
#   9393              ->  9393        directory REST gateway    (/api/v3/...)
#   9494              ->  9494        health (gRPC health protocol, NOT HTTP)
#   9696              ->  9696        Prometheus metrics
#
# NO REMAPPING WAS NEEDED. Every Topaz default port was confirmed free at both the
# container level (`docker ps`) and the host level (`ss -tln`) before this file was
# written. Ports already taken on this host and deliberately avoided:
#   80, 443, 2019 (aftershock-deploy-caddy-1)   8788 (aftershock-deploy-aftershock-1)
#   8765 (arena-app)   6380 (arena-redis)       5433 (arena-postgres)
#   11434 (k12-staging-ollama-1)                22, 27500, 18001, 18434 (host)
#
# If a future run finds a default port occupied, change ONLY the host side of the
# mapping (the left-hand number) and update this table + bin/topaz_up.sh's
# TOPAZ_AUTHZ_PORT / TOPAZ_DS_PORT defaults. The container side must stay default,
# because config/config.yaml binds those exact ports inside the container.
#
# All publishes are bound to 127.0.0.1 explicitly: this authorizer runs anonymous
# (auth.options.default.enable_anonymous: true) and must never be reachable off-host.
# -----------------------------------------------------------------------------

name: britannia-phase2

services:
  topaz:
    image: ghcr.io/aserto-dev/topaz:0.33.16@sha256:835868c04bdd7129127ea43642ffff7363d0bd26d5e1a37631fa881431054360
    container_name: britannia-phase2-topaz
    command: ["run", "-c", "/config/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8282:8282"   # authorizer gRPC
      - "127.0.0.1:8383:8383"   # authorizer REST gateway
      - "127.0.0.1:9292:9292"   # directory gRPC
      - "127.0.0.1:9393:9393"   # directory REST gateway
      - "127.0.0.1:9494:9494"   # health (gRPC)
      - "127.0.0.1:9696:9696"   # metrics
    volumes:
      - ./config:/config:ro     # config.yaml -> default path /config/config.yaml
      - ./policy:/bundle:ro     # OPA local bundle root (.manifest + britannia/*.rego)
      - topaz-db:/db            # named volume; created fresh, destroyed by `down -v`

volumes:
  topaz-db:
